<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Control de Unidades</title><meta name="theme-color" content="#0e4f86"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"><style id="app-css">/* Diseño: app móvil de una columna con barra inferior tipo Android; en pantallas anchas pasa a menú lateral.
   Identidad propia: azul profundo (operación, estructura) y verde (dinero que entra, avance). Sin logos. */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --surface-2: #f3f6f8;
  --ink: #111418;
  --muted: #5b6470;
  --line: #dce4ea;
  --accent: #0e4f86;
  --accent-ink: #ffffff;
  --accent-soft: #e5eef7;
  --sign: #1f9d63;
  --sign-ink: #ffffff;
  --plate-bg: #0e4f86;
  --grad: linear-gradient(120deg, #0e4f86 0%, #126d86 55%, #1f9d63 100%);
  --pos: #137a4b;
  --pos-soft: #e2f4ea;
  --neg: #c0392b;
  --neg-soft: #fbe8e5;
  --warn: #c0392b;
  --warn-soft: #fbe8e5;
  --pay: #1d6aa8;
  --pay-soft: #e6f0fa;
  --shadow: 0 1px 2px rgba(14, 79, 134, .06), 0 6px 18px rgba(14, 79, 134, .07);
  --f-display: "Figtree", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", Roboto, system-ui, sans-serif;
  --r: 16px;
  --nav-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1620; --surface: #13222f; --surface-2: #0f1d29; --ink: #e6eef4; --muted: #94a6b5; --line: #22374a;
    --accent: #5fa8e6; --accent-ink: #061420; --accent-soft: #15314a; --sign: #34c27f; --sign-ink: #052014; --plate-bg: #1a5f99;
    --grad: linear-gradient(120deg, #0d3f6b 0%, #0f5a6c 55%, #17784c 100%);
    --pos: #4fd08f; --pos-soft: #143526; --neg: #f2806f; --neg-soft: #3a1d1a; --warn: #f2806f; --warn-soft: #3a1d1a; --pay: #7db8ec; --pay-soft: #172c42;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1620; --surface: #13222f; --surface-2: #0f1d29; --ink: #e6eef4; --muted: #94a6b5; --line: #22374a;
  --accent: #5fa8e6; --accent-ink: #061420; --accent-soft: #15314a; --sign: #34c27f; --sign-ink: #052014; --plate-bg: #1a5f99;
  --grad: linear-gradient(120deg, #0d3f6b 0%, #0f5a6c 55%, #17784c 100%);
  --pos: #4fd08f; --pos-soft: #143526; --neg: #f2806f; --neg-soft: #3a1d1a; --warn: #f2806f; --warn-soft: #3a1d1a; --pay: #7db8ec; --pay-soft: #172c42;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--plate-bg); }
body.noscroll { overflow: hidden; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.15; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: .01em; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.muted { color: var(--muted); }
small { font-size: .82rem; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Estructura ---------- */
.app { min-height: 100%; }
.side-wrap { display: none; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--plate-bg); color: #fff; }
.topbar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1100px; margin: 0 auto; }
.tb-title small { display: block; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--sign); font-weight: 700; }
.tb-title h1 { font-size: 1.45rem; font-weight: 700; color: #fff; }
.storechip { font-size: .75rem; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, .12); color: #fff; white-space: nowrap; }
.storechip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: #9fb3c2; vertical-align: 1px; }
.storechip.cloud::before { background: #5fd49b; } .storechip.local::before { background: var(--sign); }
.main { max-width: 1100px; margin: 0 auto; padding-block: 14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
#vbody { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }

/* Barra inferior */
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-shadow: 0 -4px 16px rgba(19, 40, 58, .06); }
.bottom button { height: var(--nav-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: .7rem; font-weight: 600; position: relative; min-width: 0; }
.bottom button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.bottom button.on { color: var(--accent); }
.bottom button.on svg { background: var(--accent-soft); border-radius: 99px; padding: 3px 16px; box-sizing: content-box; margin: -3px 0; }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 18px)); bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 24; width: 60px; height: 60px; border-radius: 18px; border: 0; background: var(--sign); color: var(--sign-ink); box-shadow: 0 6px 18px rgba(0, 0, 0, .22); display: grid; place-items: center; }
.fab svg { width: 28px; height: 28px; stroke-width: 2.4; }
body[data-view="captura"] .fab, body[data-view="cortes"] .fab, body[data-view="respaldo"] .fab, body[data-view="unidades"] .fab, body[data-view="adeudos"] .fab, body[data-view="comision"] .fab, body:not(.ready) .fab { display: none; }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 250px 1fr; }
  .side-wrap { display: block; position: sticky; top: 0; height: 100vh; background: var(--plate-bg); color: #fff; padding: 18px 12px; overflow-y: auto; }
  .brand { display: flex; flex-direction: column; gap: 8px; padding: 4px 10px 18px; }
  .brand b { font-family: var(--f-display); font-size: 1.3rem; }
  .side { display: flex; flex-direction: column; gap: 2px; }
  .side button { display: flex; align-items: center; gap: 12px; border: 0; background: none; color: #c6d3dd; padding: 11px 12px; border-radius: 10px; text-align: left; font-weight: 600; }
  .side button:hover { background: rgba(255, 255, 255, .06); }
  .side button.on { background: rgba(242, 179, 27, .16); color: var(--sign); }
  .bottom { display: none; }
  .fab { bottom: 28px; right: 28px; }
  .main { padding-bottom: 60px; }
  .topbar { top: 0; }
}

/* ---------- Componentes ---------- */
.plate { display: inline-flex; align-items: center; justify-content: center; min-width: 54px; height: 34px; padding: 0 8px; border-radius: 7px; background: var(--plate-bg); color: var(--sign); font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; border: 2px solid var(--sign); flex: none; }
.plate.sm { min-width: 44px; height: 26px; font-size: .9rem; border-width: 1.5px; border-radius: 6px; }
.plate.gen { color: #c6d3dd; border-color: #6d8597; font-size: .8rem; }
.plate.pay { background: var(--pay-soft); color: var(--pay); border-color: var(--pay); font-size: .7rem; letter-spacing: .04em; }
.tag { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .08em; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; font-family: var(--f-body); }
.tag.demo { background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn); }
.tag.void { background: var(--neg-soft); color: var(--neg); }

.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3, .kblock h3, .today h3 { font-size: 1.12rem; font-weight: 700; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.card h3 small, .kblock h3 small, .rep-sec h3 small { font-family: var(--f-body); font-weight: 400; color: var(--muted); font-size: .8rem; }
.card.sep, .rep-sec.sep { border: 1.5px dashed var(--pay); background: color-mix(in srgb, var(--pay-soft) 40%, var(--surface)); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; color: var(--ink); text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--neg); border-color: var(--neg); color: #fff; }
.btn.ghost { background: transparent; }
.btn.danger-t { color: var(--neg); }
.btn.big { min-height: 54px; font-size: 1.05rem; width: 100%; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .88rem; border-radius: 10px; }
.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 1.1rem; display: grid; place-items: center; flex: none; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.row-btns .btn { flex: 1 1 140px; }
.toolbar { display: flex; }

/* Formularios */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-weight: 700; font-size: .92rem; }
.opt { font-weight: 400; color: var(--muted); font-size: .8rem; }
.hint { color: var(--muted); }
input:not([type=radio]):not([type=checkbox]):not([type=file]), select, textarea { width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 1rem; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
input[type=file] { font-size: .9rem; }
.money-in { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); padding-left: 14px; }
.money-in:focus-within { border-color: var(--accent); background: var(--surface); }
.money-in span { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; color: var(--muted); }
.money-in input { border: 0 !important; background: transparent !important; font-family: var(--f-display); font-size: 1.7rem !important; font-weight: 700; min-height: 58px !important; padding-left: 8px !important; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.quick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.quick .muted { font-size: .85rem; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; white-space: nowrap; }
.chip.on { background: var(--plate-bg); color: var(--sign); border-color: var(--plate-bg); }
.quick .chip { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: flex; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg label { flex: 1 1 auto; position: relative; }
.seg input, .unit-pick input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; text-align: center; padding: 10px 10px; border-radius: 9px; font-weight: 700; font-size: .92rem; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg input:checked + span { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg input:focus-visible + span { outline: 3px solid var(--sign); }
.unit-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.unit-pick span { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface-2); cursor: pointer; min-height: 78px; }
.unit-pick small { color: var(--muted); font-weight: 600; line-height: 1.2; }
.unit-pick input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.unit-pick input:focus-visible + span { outline: 3px solid var(--sign); }
.form-err { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--neg-soft); color: var(--neg); font-weight: 600; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }
.check input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--accent); flex: none; }

/* Filtros */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.filters .field.inline { flex: 1 1 140px; }
.filters .field.inline label { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.filters .field.inline input, .filters .field.inline select { min-height: 44px; }
.filters .field.grow { flex: 2 1 200px; }
.filters .chips, .filters .seg { flex: 1 1 100%; }
.filters.tight { gap: 8px; }

/* Indicadores */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis.two-k { grid-template-columns: 1fr 1fr; }
.kpi { background: var(--surface); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; box-shadow: var(--shadow); border-top: 3px solid var(--line); }
.kpi span { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.kpi b { font-size: 1.22rem; overflow-wrap: anywhere; }
.kpi small { color: var(--muted); }
.kpi.inc { border-top-color: var(--pos); } .kpi.inc b { color: var(--pos); }
.kpi.exp { border-top-color: var(--neg); } .kpi.exp b { color: var(--neg); }
.kpi.bal { border-top-color: var(--accent); background: var(--accent-soft); }
.kpi.bal.neg b { color: var(--neg); }
.kpi.debt-in { border-top-color: var(--sign); } .kpi.debt-out { border-top-color: var(--pay); }
.kblock { display: flex; flex-direction: column; gap: 8px; }
.kgrid { display: grid; gap: 14px; }
@media (min-width: 1000px) { .kgrid { grid-template-columns: repeat(3, 1fr); } .kgrid .kpis { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .kpi { padding: 10px 8px; } .kpi b { font-size: 1.02rem; } .kpi span { font-size: .66rem; } }
.note { margin: 0; font-size: .86rem; color: var(--muted); }

.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-weight: 600; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner span { flex: 1 1 220px; }

.today { display: flex; flex-direction: column; gap: 8px; }
.units-today, .day-units { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ut, .du { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: var(--shadow); border-left: 5px solid var(--line); min-width: 0; }
.du { box-shadow: none; background: var(--surface-2); }
.ut span, .du span { display: flex; flex-direction: column; min-width: 0; }
.ut b, .du b { font-size: 1.25rem; }
.ut small, .du small { color: var(--muted); }
.ut.ok { border-left-color: var(--pos); } .ut.short { border-left-color: var(--sign); } .ut.none { border-left-color: var(--neg); }
.ut.none b { color: var(--neg); font-size: 1.05rem; }
@media (max-width: 560px) { .day-units { grid-template-columns: 1fr; } }

.hbars { display: flex; flex-direction: column; gap: 10px; }
.hb { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; }
.hb-t { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.hb-t i { display: block; height: 100%; background: var(--neg); border-radius: 99px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-dasharray: 3 4; }
.chart .base { stroke: var(--muted); }
.chart .ax { fill: var(--muted); font-size: 21px; font-family: var(--f-body); }
.chart .ax.strong { fill: var(--ink); font-weight: 700; }
.chart .b-inc { fill: var(--pos); } .chart .b-exp { fill: var(--neg); }
.legend { display: flex; gap: 16px; font-size: .82rem; color: var(--muted); }
.lg { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.lg.inc { background: var(--pos); } .lg.exp { background: var(--neg); }

/* Listas de movimientos */
.mvs { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.mv { display: flex; align-items: center; gap: 12px; padding: 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; min-height: 64px; }
.mv:last-child { border-bottom: 0; }
.mv:active { background: var(--surface-2); }
.mv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mv-main b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mv-main small { color: var(--muted); }
.mv-amt { font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; text-align: right; white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end; }
.mv.pay .mv-amt { color: var(--pay); }
.voided { opacity: .55; } .voided .mv-amt { text-decoration: line-through; }
.total-line { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px; border-top: 2px solid var(--ink); font-weight: 700; }
.total-line b { font-size: 1.3rem; }
.sum-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-weight: 600; color: var(--muted); }
.sum-head b { font-size: 1.5rem; }
.two-col { display: grid; gap: 14px; }
@media (min-width: 760px) { .two-col { grid-template-columns: 1fr 1fr; } .cap-grid { display: grid; grid-template-columns: minmax(340px, 440px) 1fr; gap: 14px; align-items: start; } }
.cap-grid { display: flex; flex-direction: column; gap: 14px; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); background: var(--surface); border-radius: var(--r); }

/* Tablas */
.tbl-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--line); }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; background: var(--surface); }
.tbl th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); padding: 9px 10px; white-space: nowrap; }
.tbl td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl .r { text-align: right; white-space: nowrap; }
.tbl tfoot td { font-weight: 700; border-top: 2px solid var(--ink); background: var(--surface-2); }
.tbl tr.wk td { border-top: 2px solid var(--muted); }
.tbl tr.cur td { background: var(--accent-soft); font-weight: 700; }
.tbl.compact td { padding: 7px 4px; } .tbl.compact { background: transparent; }
.nocap { color: var(--warn); font-style: italic; font-size: .85rem; }

/* Adeudos */
.debts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.debt { display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: var(--shadow); text-align: left; border-left: 5px solid var(--sign); }
.debt.pagar { border-left-color: var(--pay); }
.debt-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.dir { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: auto; }
.st { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); }
.st-pendiente { background: var(--warn-soft); color: var(--warn); } .st-parcial { background: var(--accent-soft); color: var(--accent); }

<script src="config.js"></script><script src="supabase.js"></script><script>/* Núcleo de cálculos: funciones puras, sin DOM. Los importes se manejan en centavos (enteros)

  function diff(a, b) {

  /** Guarda (crea o actualiza) un registro. El id lo fija el formulario al abrirse: volver a guardar no duplica. */
  async function save(rec, act, quiet) {
    const prev = S.byId[rec.id];
    const r = Object.assign({}, rec);
    r.updatedAt = nowISO();
    if (!prev) { r.createdAt = r.createdAt || r.updatedAt; }
    const h = (prev && prev.hist) ? prev.hist.slice(-30) : (r.hist || []);
    const ch = prev ? diff(prev, r) : null;
    h.push({ at: r.updatedAt, act: act || (prev ? 'editado' : 'creado'), ch: ch && Object.keys(ch).length ? ch : undefined });
    r.hist = h;
    const before = S.records;
    setRecords(prev ? S.records.map((x) => (x.id === r.id ? r : x)) : S.records.concat([r]));
    try {
      await S.store.put(r);
      if (!quiet) toast('Guardado ✓ ' + (S.store.kind === 'cloud' ? 'en la nube' : 'en este dispositivo'));
      refresh();
      return r;
    } catch (e) {
      setRecords(before); refresh();
      toast(writeError(e), 'err'); throw e;
    }
  }

    if (c === 'revoked') return 'Se perdió el acceso a la base de datos. Recarga la página.';

  /* ---------- Avisos, hojas y confirmaciones ---------- */
  let toastT;
  function toast(msg, kind) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (kind === 'err' ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(() => { t.className = 'toast'; }, kind === 'err' ? 6000 : 2600);

  const sheets = [];
  function openSheet(title, html, onMount) {
    const wrap = document.createElement('div'); wrap.className = 'sheet-wrap';
    wrap.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-head"><h2>' + esc(title) + '</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar">✕</button></div><div class="sheet-body">' + html + '</div></div>';
    document.body.appendChild(wrap); sheets.push(wrap);
    wrap.addEventListener('click', (e) => { if (e.target === wrap || e.target.closest('[data-close]')) closeSheet(wrap); });
    document.body.classList.add('noscroll');
    if (onMount) onMount($('.sheet-body', wrap), () => closeSheet(wrap));
    const f = $('input:not([type=hidden]):not([type=radio]),select,textarea', wrap); if (f && window.innerWidth > 700) f.focus();
    return wrap;
  }
  function closeSheet(w) { w = w || sheets[sheets.length - 1]; if (!w) return; w.remove(); sheets.splice(sheets.indexOf(w), 1); if (!sheets.length) document.body.classList.remove('noscroll'); }
  /** Confirmación propia (los diálogos del navegador no funcionan dentro de claude.ai). */
  function confirmBox(o) {
    return new Promise((resolve) => {
      let done = false;
      const html = '<div class="confirm"><p>' + o.body + '</p>' +
        (o.check ? '<label class="check"><input type="checkbox" id="cf-check"> ' + esc(o.check) + '</label>' : '') +
        '<div class="row-btns"><button type="button" class="btn ghost" data-no>Cancelar</button><button type="button" class="btn ' + (o.danger ? 'danger' : 'primary') + '" data-ok' + (o.check ? ' disabled' : '') + '>' + esc(o.ok || 'Aceptar') + '</button></div></div>';
      const w = openSheet(o.title || 'Confirmar', html, (b, close) => {
        const ok = $('[data-ok]', b);
        if (o.check) $('#cf-check', b).addEventListener('change', (e) => { ok.disabled = !e.target.checked; });
        ok.addEventListener('click', () => { done = true; close(); resolve(true); });
        $('[data-no]', b).addEventListener('click', () => { done = true; close(); resolve(false); });
      });
      w.classList.add('confirm-wrap');
      const obs = new MutationObserver(() => { if (!document.body.contains(w)) { obs.disconnect(); if (!done) resolve(false); } });
      obs.observe(document.body, { childList: true });
    });
  }

  /* ---------- Archivos: descarga, impresión ---------- */
  let dlP;
  function downloadsCap() { if (!S.framed) return Promise.resolve(null); if (!dlP) dlP = window.claude.use('downloads').catch(() => null); return dlP; }
  async function saveFile(filename, data, mime) {
    if (S.framed) {
      const dl = await downloadsCap();
      if (dl) {
        try { await dl.save({ filename, data }); toast('Archivo entregado: ' + filename); return true; } catch (e) {
          if (e && e.code === 'declined') { toast('Descarga cancelada'); return false; }
          if (e && e.code === 'rate_limited') { toast('Hay otra descarga pendiente de confirmar', 'err'); return false; }
        }
      }
      if (typeof data === 'string') { showCopy(filename, data); return false; }
      toast('Las descargas no están disponibles en esta vista.', 'err'); return false;
    }
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Descargado: ' + filename); return true;
  }
  function showCopy(filename, text) {
    openSheet('Copiar ' + filename, '<p class="muted">Esta vista no permite descargar archivos. Copia el contenido y pégalo en un archivo de texto llamado <b>' + esc(filename) + '</b>.</p><textarea class="copybox" id="copybox" readonly>' + esc(text) + '</textarea><button class="btn primary" type="button" id="copy-btn">Copiar</button>', (b) => {
      $('#copy-btn', b).addEventListener('click', () => {
        const ta = $('#copybox', b);
        navigator.clipboard.writeText(text).then(() => toast('Copiado'), () => { ta.select(); toast('Selecciona y copia el texto'); });
      });
    });
  }
  function reportDocument(title, html) {
    const css = $('#app-css').textContent;
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(title) + '</title><style>' + css + '</style></head><body class="report-doc"><main class="report">' + html + '</main><script>setTimeout(function(){try{window.print()}catch(e){}},400)<\/script></body></html>';
  }
  async function printReport(title, html, fname) {
    if (!S.framed) {
      const pa = $('#print-area'); pa.innerHTML = '<main class="report">' + html + '</main>';
      document.body.classList.add('printing');

  let xlsxP;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxP) xlsxP = new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxP = null; ko(new Error('xlsx')); }; document.head.appendChild(s); });
    return xlsxP;
  }
  async function saveExcel(fname, sheetsData) {
    try {
      const X = await loadXLSX(); const wb = X.utils.book_new();
      sheetsData.forEach((sd) => { const ws = X.utils.aoa_to_sheet(sd.rows); ws['!cols'] = sd.rows[0].map(() => ({ wch: 18 })); X.utils.book_append_sheet(wb, ws, sd.name.slice(0, 31)); });
      const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
      await saveFile(fname + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    } catch (e) {
      toast('No se pudo generar Excel sin conexión; se exporta CSV (se abre en Excel).', 'err');
      await saveFile(fname + '.csv', C.toCSV(sheetsData.flatMap((s, i) => (i ? [[], [s.name]] : [[s.name]]).concat(s.rows))), 'text/csv');

  function shrinkImage(file) {
    return new Promise((ok, ko) => {
      const fr = new FileReader(); fr.onerror = () => ko(fr.error);
      fr.onload = () => { const img = new Image(); img.onerror = () => ko(new Error('img')); img.onload = () => {
        const k = Math.min(1, 1280 / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        let q = 0.7, out = cv.toDataURL('image/jpeg', q); while (out.length > 230000 && q > 0.3) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
        ok(out); }; img.src = fr.result; };
      fr.readAsDataURL(file);
    });
  }

  function chart14(ref, u) {

    const mx = Math.max(1, ...data.map((x) => Math.max(x.i, x.e)));
    const W = 640, H = 250, pl = 8, pb = 36, pt = 30, bw = (W - pl * 2) / days.length;
    const yv = (v) => pt + (H - pt - pb) * (1 - v / mx);

    [0.5, 1].forEach((f) => { s += '<line x1="0" x2="' + W + '" y1="' + yv(mx * f) + '" y2="' + yv(mx * f) + '" class="grid"/><text x="' + (W - 4) + '" y="' + (yv(mx * f) - 3) + '" text-anchor="end" class="ax">' + M(mx * f).replace('.00', '') + '</text>'; });
    data.forEach((x, k) => {

      if (!x.n) s += '<text x="' + (x0 + bw / 2) + '" y="' + (H - pb - 4) + '" text-anchor="middle" class="ax faint">·</text>';
      s += '<text x="' + (x0 + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle" class="ax' + (x.d === ref ? ' strong' : '') + '">' + +x.d.slice(8) + '</text>';

  /* 5. Historial y calendario: Año → Mes → Semana → Día */

  function cellDay(d, u) {

  function histMonth(y, m, u) {

        '<div class="dots" aria-hidden="true">' + dots + '</div><div class="week-n"><span class="pos num">' + M(s.income) + '</span><span class="neg num">−' + M(s.expense) + '</span><b class="num ' + signCls(s.balance) + '">' + M(s.balance) + '</b></div></button>';

  function histWeek(ws, u) {

  function monthsCompare(y, m, u) {

  function auditList() {

  function importFile(file) {
    const fr = new FileReader();
    fr.onload = () => {
      let obj; try { obj = JSON.parse(fr.result); } catch (e) { return openSheet('Archivo no válido', '<p>El archivo no es un JSON válido. Elige un respaldo descargado desde esta aplicación.</p>'); }

        '<p><b>Combinar sin duplicar:</b> agrega ' + mg.added + ' registros nuevos, actualiza ' + mg.updated + ' que son más recientes en el respaldo y deja igual ' + mg.same + '.</p>' +
        '<p><b>Reemplazar todo:</b> borra los ' + S.records.length + ' registros actuales y deja solo los del respaldo.</p>' +
        '<div class="row-btns"><button type="button" class="btn primary" data-merge>Combinar sin duplicar</button><button type="button" class="btn danger" data-replace>Reemplazar todo</button></div>';
      openSheet('Importar respaldo', html, (b, close) => {

        $('[data-merge]', b).addEventListener('click', (e) => guard(e.target, async () => {
          const changed = v.records.filter((r) => { const c = S.byId[r.id]; return !c || (r.updatedAt || '') > (c.updatedAt || ''); });
          toast('Importando ' + changed.length + ' registros…');
          await S.store.putMany(changed); await putRc(); setRecords(mg.records); refresh(); close();
          toast('Importación completa: ' + mg.added + ' nuevos, ' + mg.updated + ' actualizados, sin duplicados');

          const ok = await confirmBox({ title: 'Reemplazar toda la información', danger: true, ok: 'Reemplazar', body: 'Se borrarán los ' + S.records.length + ' registros actuales y se cargarán los ' + v.records.length + ' del respaldo.', check: 'Entiendo que se sobrescribirá la información actual' });
          if (!ok) return; toast('Reemplazando…');
          await S.store.clear(); await S.store.putMany(v.records); await putRc(); setRecords(v.records.slice()); refresh(); close(); toast('Respaldo restaurado: ' + v.records.length + ' registros');
        }));
      });
    };

  }

    } catch (e) {

      $('#main').innerHTML = '<div class="banner warn">No se pudo abrir el almacenamiento (' + esc(e && (e.code || e.message)) + '). Recarga la página. Si estás en modo incógnito, abre la aplicación en una ventana normal.</div>';
      return;
    }
    $('#storechip').textContent = S.store.kind === 'cloud' ? 'Nube' : 'Este dispositivo';
    $('#storechip').className = 'storechip ' + S.store.kind;
    $('#storechip').title = S.store.label;
    let v = 'inicio'; try { v = localStorage.getItem('cu-view') || 'inicio'; } catch (e) { /* opcional */ }
    if (location.hash && V[location.hash.slice(1)]) v = location.hash.slice(1);
    go(V[v] ? v : 'inicio');
    document.body.classList.add('ready');
  }
  Object.assign(window.App, { save, removeRec, loadDemo, removeDemo, go, refresh, buildReport, corPeriod, exportBackup, validate: C.validateBackup, records: () => S.records });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
